# ============================================================
# Этот файл нужно добавить в репозиторий wanderfox1/recontext-user-portal
# по пути: .github/workflows/deploy.yml
#
# Необходимые секреты в Settings → Secrets → Actions этого репо:
#   DOCKER_USERNAME  — логин Docker Hub (raykzer)
#   DOCKER_PASSWORD  — пароль / access token Docker Hub
#   SERVER_HOST      — IP или домен сервера
#   SERVER_USER      — SSH-пользователь сервера
#   SERVER_SSH_KEY   — приватный SSH-ключ (содержимое файла recontext_deploy)
#   SERVER_SSH_PORT  — SSH-порт (если не 22)
#
# Дополнительно в репо должны быть файлы:
#   nginx.conf       — конфиг nginx (см. docs/nginx.conf в backend-репо)
#   Dockerfile       — сборка nginx-образа (см. docs/Dockerfile.frontend в backend-репо)
# ============================================================

name: Deploy User Portal Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: raykzer/recontext-user-portal-front

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: bash /opt/recontext/scripts/deploy.sh

      - name: Summary
        run: |
          echo "## Deploy Result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image pushed: ${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployed to: ${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
