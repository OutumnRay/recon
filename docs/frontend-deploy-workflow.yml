# ============================================================
# Этот файл нужно добавить в репозиторий wanderfox1/recontext-user-portal
# по пути: .github/workflows/deploy.yml
#
# Необходимые секреты в настройках frontend-репо (Settings → Secrets):
#   BACKEND_REPO_TOKEN  — GitHub Personal Access Token с правом repo:read
#                         на приватный репозиторий OutumnRay/recon
#                         (если backend-репо публичный — удалите token из шага ниже)
#   DOCKER_USERNAME     — логин Docker Hub (raykzer)
#   DOCKER_PASSWORD     — пароль / access token Docker Hub
#   SERVER_HOST         — IP или домен сервера
#   SERVER_USER         — SSH-пользователь сервера
#   SERVER_SSH_KEY      — приватный SSH-ключ (PEM)
#   SERVER_SSH_PORT     — SSH-порт (если не 22)
# ============================================================

name: Deploy User Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_USERNAME: raykzer
  IMAGE_NAME: raykzer/recontext-user-portal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Сначала чекаутим backend-репо в корень workspace.
      #    Dockerfile и Go-код берём оттуда.
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: OutumnRay/recon
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          # Если backend-репо публичный — удалите строку token выше

      # 2. Чекаутим этот frontend-репо в front/user-portal/.
      #    Dockerfile ожидает именно этот путь внутри build-контекста.
      - name: Checkout this frontend repo
        uses: actions/checkout@v4
        with:
          path: front/user-portal

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.user-portal
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILDKIT_PROGRESS=plain

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: bash /opt/recontext/scripts/deploy.sh

      - name: Summary
        run: |
          echo "## Deploy Result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image pushed: ${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployed to server: ${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
