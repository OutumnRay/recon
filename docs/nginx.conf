# ============================================================
# Этот файл нужно добавить в корень репозитория wanderfox1/recontext-user-portal
# как: nginx.conf
# ============================================================

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # API — проксируем к Go-бэкенду
    location /api/ {
        proxy_pass http://user-portal:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    # WebSocket
    location /ws {
        proxy_pass http://user-portal:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Swagger UI
    location /swagger/ {
        proxy_pass http://user-portal:8081;
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        proxy_pass http://user-portal:8081;
    }

    # Загруженные файлы (аватары и др.)
    location /uploads/ {
        proxy_pass http://user-portal:8081;
        proxy_set_header Host $host;
    }

    # SPA-роутинг — все остальные пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
