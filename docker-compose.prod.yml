# docker-compose для деплоя на выделенный сервер (production)
# Отличия от docker-compose.yml (TimeWeb):
#   - named volumes для PostgreSQL, MinIO, Qdrant, RabbitMQ (данные сохраняются)
#   - использует готовые образы из Docker Hub (не собирает локально)
#   - pull_policy: always — всегда тянет свежий образ при up -d

services:
  # 1. Managing Portal
  managing-portal:
    image: raykzer/recontext-managing-portal:latest
    pull_policy: always
    container_name: recontext-managing-portal
    ports:
      - "${MANAGING_PORTAL_PORT:-20080}:8080"
    environment:
      - APP_VERSION=${APP_VERSION:-0.1.0+0}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-recontext}
      - DB_PASSWORD=${DB_PASSWORD:-recontext}
      - DB_NAME=${DB_NAME:-recontext}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-recontext}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-recontext}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-recontext}:${RABBITMQ_PASSWORD:-recontext}@rabbitmq:5672/
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-recontext}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - LIVEKIT_WEBHOOK_DEBUG=${LIVEKIT_WEBHOOK_DEBUG:-false}
      - DEBUG_LOGS_ENABLED=${DEBUG_LOGS_ENABLED:-false}
      - LIVEKIT_EGRESS_ENABLED=${LIVEKIT_EGRESS_ENABLED:-false}
      - LIVEKIT_EGRESS_S3_ENDPOINT=${LIVEKIT_EGRESS_S3_ENDPOINT:-}
      - LIVEKIT_EGRESS_S3_BUCKET=${LIVEKIT_EGRESS_S3_BUCKET:-recontext}
      - LIVEKIT_EGRESS_S3_ACCESS_KEY=${LIVEKIT_EGRESS_S3_ACCESS_KEY:-minioadmin}
      - LIVEKIT_EGRESS_S3_SECRET=${LIVEKIT_EGRESS_S3_SECRET:-minioadmin}
      - LIVEKIT_EGRESS_S3_REGION=${LIVEKIT_EGRESS_S3_REGION:-}
      - LIVEKIT_EGRESS_RECORD_TRACKS=${LIVEKIT_EGRESS_RECORD_TRACKS:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-noreply@localhost}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Recontext}
      - PORTAL_URL=${PORTAL_URL:-http://localhost:20081}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@recontext.online}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - recontext-network
    restart: unless-stopped

  # 2. User Portal
  user-portal-front:
    image: raykzer/recontext-user-portal-front:latest
    pull_policy: always
    container_name: recontext-user-portal-front
    ports:
      - "${USER_PORTAL_PORT:-20081}:80"
    volumes:
      - ./deployments/nginx/user-portal-front.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-portal
    networks:
      - recontext-network
    restart: unless-stopped

  user-portal:
    image: raykzer/recontext-user-portal:latest
    pull_policy: always
    container_name: recontext-user-portal
    environment:
      - APP_VERSION=${APP_VERSION:-0.1.0+0}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-recontext}
      - DB_PASSWORD=${DB_PASSWORD:-recontext}
      - DB_NAME=${DB_NAME:-recontext}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-recontext}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-recontext}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-recontext}:${RABBITMQ_PASSWORD:-recontext}@rabbitmq:5672/
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-recontext}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - LIVEKIT_WEBHOOK_DEBUG=${LIVEKIT_WEBHOOK_DEBUG:-false}
      - DEBUG_LOGS_ENABLED=${DEBUG_LOGS_ENABLED:-false}
      - LIVEKIT_EGRESS_ENABLED=${LIVEKIT_EGRESS_ENABLED:-false}
      - LIVEKIT_EGRESS_S3_ENDPOINT=${LIVEKIT_EGRESS_S3_ENDPOINT:-}
      - LIVEKIT_EGRESS_S3_BUCKET=${LIVEKIT_EGRESS_S3_BUCKET:-recontext}
      - LIVEKIT_EGRESS_S3_ACCESS_KEY=${LIVEKIT_EGRESS_S3_ACCESS_KEY:-minioadmin}
      - LIVEKIT_EGRESS_S3_SECRET=${LIVEKIT_EGRESS_S3_SECRET:-minioadmin}
      - LIVEKIT_EGRESS_S3_REGION=${LIVEKIT_EGRESS_S3_REGION:-}
      - LIVEKIT_EGRESS_RECORD_TRACKS=${LIVEKIT_EGRESS_RECORD_TRACKS:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-noreply@localhost}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Recontext}
      - PORTAL_URL=${PORTAL_URL:-http://localhost:20081}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TASK_QUEUE=${REDIS_TASK_QUEUE:-recontext:transcription:queue}
      - REDIS_RESULT_QUEUE=${REDIS_RESULT_QUEUE:-recontext:transcription:results}
      - FCM_CREDENTIALS_JSON=${FCM_CREDENTIALS_JSON:-}
      - LLM_API_ENDPOINT=${LLM_API_ENDPOINT:-http://ollama:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:3b}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@recontext.online}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recontext-network
    restart: unless-stopped

  # 3. PostgreSQL с pgvector — данные хранятся в named volume
  postgres:
    image: pgvector/pgvector:pg16
    container_name: recontext-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-recontext}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-recontext}
      - POSTGRES_DB=${DB_NAME:-recontext}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - recontext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recontext}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. RabbitMQ — очереди сохраняются в named volume
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: recontext-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-recontext}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-recontext}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./deployments/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - recontext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 5. Redis — кэш и очередь задач (ephemeral — данные не критичны)
  redis:
    image: redis:7-alpine
    container_name: recontext-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --save "" --appendonly no --loglevel warning
    networks:
      - recontext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. Python Transcription Worker
  transcription-worker-py:
    image: raykzer/recontext-transcription-worker:latest
    pull_policy: always
    container_name: recontext-transcription-worker-py
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_TASK_QUEUE=${REDIS_TASK_QUEUE:-recontext:transcription:queue}
      - REDIS_RESULT_QUEUE=${REDIS_RESULT_QUEUE:-recontext:transcription:results}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-recontext}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-ru}
      - HF_TOKEN=${HF_TOKEN:-}
      - ENABLE_DIARIZATION=${ENABLE_DIARIZATION:-false}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_ENABLED=${QDRANT_ENABLED:-false}
      - ENABLE_AUDIO_ENHANCEMENT=${ENABLE_AUDIO_ENHANCEMENT:-true}
      - MAX_PAUSE_SECONDS=${MAX_PAUSE_SECONDS:-1.5}
      - MAX_PARAGRAPH_CHARS=${MAX_PARAGRAPH_CHARS:-800}
      - WORKDIR=/tmp/recontext-worker
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HEALTH_PORT=8085
    ports:
      - "8085:8085"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - recontext-network
    restart: unless-stopped

  # 7. MinIO Storage — файлы сохраняются в named volume
  minio:
    image: minio/minio:latest
    container_name: recontext-minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - recontext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 8. Qdrant Vector DB — индексы сохраняются в named volume
  qdrant:
    image: qdrant/qdrant:latest
    container_name: recontext-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - recontext-network
    restart: unless-stopped

  # 9. Ollama — локальный LLM для AI-ассистента
  ollama:
    image: ollama/ollama:latest
    container_name: recontext-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - recontext-network
    restart: unless-stopped

  # 10. Prometheus — сбор метрик со всех сервисов
  prometheus:
    image: prom/prometheus:latest
    container_name: recontext-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - recontext-network
    restart: unless-stopped

  # 11. Grafana — дашборды и визуализация
  grafana:
    image: grafana/grafana:11.5.2
    container_name: recontext-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-grafana123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://grafana.24recontext.ru}
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - recontext-network
    restart: unless-stopped

  # 12. cAdvisor — метрики Docker-контейнеров
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: recontext-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - recontext-network
    restart: unless-stopped

  # 13. PostgreSQL Exporter — метрики базы данных
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: recontext-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER:-recontext}:${DB_PASSWORD:-recontext}@postgres:5432/${DB_NAME:-recontext}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recontext-network
    restart: unless-stopped

  # 14. LiveKit Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: recontext-livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - "LIVEKIT_KEYS=devkey: devsecret"
    command: --dev --bind 0.0.0.0
    networks:
      - recontext-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  qdrant_data:
    driver: local
  rabbitmq_data:
    driver: local
  ollama_models:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  recontext-network:
    driver: bridge
