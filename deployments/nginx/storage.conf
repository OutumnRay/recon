# Хостовый nginx: MinIO S3 API — storage.24recontext.ru
# Браузер загружает/скачивает файлы напрямую по presigned URL (MINIO_PUBLIC_ENDPOINT=https://storage.24recontext.ru).
# Установка: sudo cp deployments/nginx/storage.conf /etc/nginx/sites-available/recontext-storage.conf
# HTTPS добавляет certbot: sudo certbot --nginx -d storage.24recontext.ru
server {
    listen 80;
    server_name storage.24recontext.ru;

    # Без ограничения размера и без буферизации — файлы могут быть большими
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    ignore_invalid_headers off;

    location / {
        proxy_pass http://127.0.0.1:9000;
        # Host обязан совпадать с хостом в подписи presigned URL
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
    }
}
