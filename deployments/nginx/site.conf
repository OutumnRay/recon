# Хостовый nginx: основной сайт (User Portal) — 24recontext.ru
# Установка: sudo cp deployments/nginx/site.conf /etc/nginx/sites-available/recontext-site.conf
# HTTPS добавляет certbot: sudo certbot --nginx -d 24recontext.ru -d www.24recontext.ru
server {
    listen 80;
    server_name 24recontext.ru www.24recontext.ru;

    # Большие файлы идут напрямую в MinIO по presigned URL, но multipart-загрузка через API тоже есть (до 500 МБ)
    client_max_body_size 600m;

    location / {
        proxy_pass http://127.0.0.1:20081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (/ws — уведомления)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 360s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 360s;
    }
}
