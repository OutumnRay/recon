# Хостовый nginx: Managing Portal — admin.24recontext.ru
# Установка: sudo cp deployments/nginx/admin.conf /etc/nginx/sites-available/recontext-admin.conf
# HTTPS добавляет certbot: sudo certbot --nginx -d admin.24recontext.ru
server {
    listen 80;
    server_name admin.24recontext.ru;

    client_max_body_size 600m;

    location / {
        proxy_pass http://127.0.0.1:20080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 360s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 360s;
    }
}
