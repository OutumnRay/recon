# Хостовый nginx: сигналинг LiveKit — livekit.24recontext.ru (LIVEKIT_URL=wss://livekit.24recontext.ru)
# Медиа (7881/tcp, 7882/udp) идёт мимо nginx — эти порты пробрасываются на роутере напрямую.
# Установка: sudo cp deployments/nginx/livekit.conf /etc/nginx/sites-available/recontext-livekit.conf
# HTTPS добавляет certbot: sudo certbot --nginx -d livekit.24recontext.ru
server {
    listen 80;
    server_name livekit.24recontext.ru;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
